<!DOCTYPE html>
<html lang="es">
<head>
    <script>window.location.replace('/admin.html');</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - E-commerce</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <script>
        // Bloqueo de seguridad inmediato antes de cargar la página
        document.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem("token");
            const role = localStorage.getItem("userRole");

            if (!token || role !== "admin") {
                alert("Acceso denegado. Se requieren permisos de administrador.");
                window.location.href = "login.html"; // Lo saca de la vista admin
            }
        });
    </script>
</head>
<body class="admin-body">

    <div class="dashboard-layout">
        
        <aside class="admin-sidebar">
            <div class="sidebar-brand">
                <div class="logo">ADMIN<span>PANEL</span></div>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li>
                        <button class="sidebar-link active" id="nav-prod" onclick="switchAdminView('products')">
                            <i class="fa-solid fa-box-open"></i> Productos
                        </button>
                    </li>
                    <li>
                        <button class="sidebar-link" id="nav-cust" onclick="switchAdminView('customers')">
                            <i class="fa-solid fa-users"></i> Clientes
                        </button>
                    </li>
                    <li class="sidebar-separator"></li>
                    <li>
                        <a href="#" class="sidebar-link logout-link" onclick="logoutUsuario(); return false;">
                            <i class="fa-solid fa-right-from-bracket"></i> Salir
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="admin-content">
            
            <section id="admin-products" class="admin-section active">
                <div class="section-header">
                    <h2>Gestión de Productos</h2>
                    <button class="btn-hero" style="margin: 0;" onclick="openAdminModal('product')">
                        <i class="fa-solid fa-plus"></i> Nuevo Producto
                    </button>
                </div>
                
                <div class="admin-card">
                    <p class="auth-subtitle">Aquí aparecerá el listado de tus productos actuales para editar o borrar.</p>
                    </div>
            </section>

            <section id="admin-customers" class="admin-section">
                <div class="section-header">
                    <h2>Gestión de Clientes</h2>
                    <button class="btn-hero" style="margin: 0; background: var(--accent-color);" onclick="openAdminModal('customer')">
                        <i class="fa-solid fa-user-plus"></i> Nuevo Cliente
                    </button>
                </div>

                <div class="admin-card">
                    <p class="auth-subtitle">Aquí aparecerá el listado de usuarios registrados en tu plataforma.</p>
                    </div>
            </section>
        </main>
    </div>

    <div id="admin-modal" class="menu-overlay" style="align-items: center; justify-content: center;">
        <div class="auth-container" style="margin: 0; position: relative; max-width: 500px; width: 90%;">
            <button class="btn-remove" style="position: absolute; top: 15px; right: 20px; font-size: 1.5rem;" onclick="closeAdminModal()">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <div id="modal-form-content"></div>
        </div>
    </div>

    <script src="../js/main.js"></script>
</body>
</html>
