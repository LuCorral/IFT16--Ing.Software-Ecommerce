    </style>
</head>
<body class="admin-body">

    <div class="dashboard-layout">
        
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="sidebar-brand">
                <div class="logo">ADMIN<span>PANEL</span></div>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li>
                        <button class="sidebar-link active" id="nav-prod" onclick="switchAdminView('products')">
                            <i class="fa-solid fa-box-open"></i> Productos
                        </button>
                    </li>
                    <li class="sidebar-separator"></li>
                    <li>
    <button class="sidebar-link" onclick="window.location.href='../index.html'">
        <i class="fa-solid fa-house"></i> Ir al inicio
    </button>
</li>
                    <li>
                        <button class="sidebar-link logout-link" onclick="logoutUsuario();">
                            <i class="fa-solid fa-right-from-bracket"></i> Salir
                        </button>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="admin-content">
            
            <!-- Sección Productos -->
            <section id="admin-products" class="admin-section active">
                <div class="section-header">
                    <h2><i class="fa-solid fa-box-open"></i> Gestión de Productos</h2>
                    <div class="section-actions">
                        <button class="btn-hero" style="margin: 0;" onclick="openProductModal()">
                            <i class="fa-solid fa-plus"></i> Nuevo Producto
                        </button>
                    </div>
                </div>

                <form class="admin-filters" id="product-filters">
                    <div class="admin-filter-field">
                        <label for="product-name-filter">Nombre</label>
                        <div class="admin-filter-input-wrap">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input
                                class="admin-filter-input"
                                type="search"
                                id="product-name-filter"
                                placeholder="Buscar producto"
                                autocomplete="off"
                            >
                        </div>
                    </div>
                    <div class="admin-filter-field">
                        <label for="product-category-filter">Categoría</label>
                        <select class="admin-filter-control" id="product-category-filter">
                            <option value="">Todas las categorías</option>
                        </select>
                    </div>
                    <div class="admin-filter-actions">
                        <button type="submit" class="btn-filter-primary">
                            <i class="fa-solid fa-filter"></i> Filtrar
                        </button>
                        <button type="button" class="btn-filter-secondary" onclick="resetProductFilters()">
                            <i class="fa-solid fa-rotate-left"></i> Limpiar
                        </button>
                    </div>
                </form>
                
                <div class="admin-card" id="products-container">
                    <div class="loading-spinner">
                        <i class="fa-solid fa-spinner fa-pulse"></i>
                        <p>Cargando productos...</p>
                    </div>
                </div>
            </section>

            <!-- Sección Clientes -->
            <section id="admin-customers" class="admin-section" hidden>
                <div class="section-header">
                    <h2><i class="fa-solid fa-users"></i> Gestión de Clientes</h2>
                    <div class="section-actions">
                        <button class="btn-export-csv" type="button" onclick="exportCustomersCsv()">
                            <i class="fa-solid fa-file-csv"></i> Bajar Excel/CSV
                        </button>
                        <button class="btn-hero" style="margin: 0; background: var(--accent-color);" onclick="openCustomerModal()">
                            <i class="fa-solid fa-user-plus"></i> Nuevo Cliente
                        </button>
                    </div>
                </div>

                <div class="admin-card" id="customers-container">
                    <div class="loading-spinner">
                        <i class="fa-solid fa-spinner fa-pulse"></i>
                        <p>Cargando clientes...</p>
                    </div>
                </div>
            </section>

            <!-- Sección Cupones -->
            <section id="admin-coupons" class="admin-section" hidden>
                <div class="section-header">
                    <h2><i class="fa-solid fa-ticket"></i> Gestión de Descuentos</h2>
                    <div class="section-actions">
                        <button class="btn-export-csv" type="button" onclick="exportCouponsCsv()">
                            <i class="fa-solid fa-file-csv"></i> Bajar Excel/CSV
                        </button>
                        <button class="btn-hero" style="margin: 0; background: var(--secondary-color);" onclick="openCouponModal()">
                            <i class="fa-solid fa-plus"></i> Nuevo Cupón
                        </button>
                    </div>
                </div>

                <div class="admin-card" id="coupons-container">
                    <div class="loading-spinner">
                        <i class="fa-solid fa-spinner fa-pulse"></i>
                        <p>Cargando cupones...</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal (reemplaza el antiguo) -->
    <div id="admin-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Nuevo Producto</h2>
                <button class="modal-close" onclick="closeAdminModal()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- El formulario se inyecta dinámicamente -->
            </div>
        </div>
    </div>

    <!-- Notificación flotante -->
    <div id="notification" class="notification"></div>

    <script src="../js/main.js?v=admin-coupons"></script>
    
    <script>
        (() => {
            // Verificación de seguridad al cargar la página
            (function checkAdminAccess() {
                const token = localStorage.getItem("token");
                const role = localStorage.getItem("userRole");

                if (!token || role !== "admin") {
                    alert("Acceso denegado. Se requieren permisos de administrador.");
                    window.location.href = "login.html";
                }
            })();

            // ========== FUNCIONES PARA PRODUCTOS ==========

            function getAuthHeaders() {
                const token = localStorage.getItem('token');
                return token ? { 'Authorization': `Bearer ${token}` } : {};
            }

            async function getErrorMessage(response, fallback) {
                try {
                    const error = await response.json();
                    return error.message || error.mensaje || error.error || error.detalle || fallback;
                } catch {
                    return fallback;
                }
            }

            function getItemsFromResponse(payload) {
                return Array.isArray(payload) ? payload : payload.items || payload.data || [];
            }

            function getPaginationFromResponse(payload, itemsLength = 0) {
                if (Array.isArray(payload)) return null;

                const pagination = payload.pagination || payload.metadata || null;
                if (!pagination) return null;

                const page = Number(pagination.page || pagination.currentPage) || 1;
                const limit = Number(pagination.limit) || itemsLength || 1;
                const totalItems = Number(pagination.totalItems) || itemsLength;

                return {
                    ...pagination,
                    page,
                    currentPage: page,
                    limit,
                    totalItems,
                    totalPages: Number(pagination.totalPages) || Math.ceil(totalItems / limit),
                    fromItem: totalItems === 0 ? 0 : ((page - 1) * limit) + 1,
                    toItem: Math.min(page * limit, totalItems),
                    hasPreviousPage: Boolean(pagination.hasPreviousPage),
                    hasNextPage: Boolean(pagination.hasNextPage),
                };
            }

            const ADMIN_PRODUCTS_LIMIT = 6;
            const ADMIN_CUSTOMERS_LIMIT = 8;
            const ADMIN_COUPONS_LIMIT = 8;
            let adminProductsPage = 1;
            let adminCustomersPage = 1;
            let adminCouponsPage = 1;
            let lastAdminProducts = [];
            let lastProductsPagination = null;
            let lastAdminCustomers = [];
            let lastCustomersPagination = null;
            let lastAdminCoupons = [];
            let lastCouponsPagination = null;
            
            // Variables para acumular datos (load more)
            let allProductsData = [];
            let allCustomersData = [];
            let allCouponsData = [];
            let isLoadingProducts = false;
            let isLoadingCustomers = false;
            let isLoadingCoupons = false;
            
            const adminProductFilters = {
                nombre: '',
                categoria: ''
            };

            function escapeHtml(value) {
                return String(value ?? '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            function hasActiveProductFilters() {
                return Boolean(adminProductFilters.nombre || adminProductFilters.categoria);
            }

            function buildProductsUrl(page, limit = ADMIN_PRODUCTS_LIMIT) {
                const params = new URLSearchParams({
                    page: String(page),
                    limit: String(limit)
                });

                if (adminProductFilters.nombre) {
                    params.set('nombre', adminProductFilters.nombre);
                }

                if (adminProductFilters.categoria) {
                    params.set('categoria', adminProductFilters.categoria);
                }

                return `/api/productos?${params.toString()}`;
            }

            function buildCustomersUrl(page, limit = ADMIN_CUSTOMERS_LIMIT) {
                const params = new URLSearchParams({
                    page: String(page),
                    limit: String(limit)
                });

                return `/api/usuarios?${params.toString()}`;
            }

            function buildCouponsUrl(page, limit = ADMIN_COUPONS_LIMIT) {
                const params = new URLSearchParams({
                    page: String(page),
                    limit: String(limit)
                });

                return `/api/cupones?${params.toString()}`;
            }

            async function loadProductCategories() {
                const categorySelect = document.getElementById('product-category-filter');
                if (!categorySelect) return;

                try {
                    const response = await fetch('/api/categorias');
                    if (!response.ok) throw new Error('Error al cargar categorías');

                    const categorias = await response.json();
                    const options = ['<option value="">Todas las categorías</option>'];

                    categorias.forEach((categoria) => {
                        const selected = categoria === adminProductFilters.categoria ? 'selected' : '';
                        options.push(`<option value="${escapeHtml(categoria)}" ${selected}>${escapeHtml(categoria)}</option>`);
                    });

                    categorySelect.innerHTML = options.join('');
                } catch (error) {
                    console.error('Error:', error);
                }
            }

            function setupProductFilters() {
                const form = document.getElementById('product-filters');
                if (!form) return;

                form.addEventListener('submit', (event) => {
                    event.preventDefault();
                    adminProductFilters.nombre = document.getElementById('product-name-filter')?.value.trim() || '';
                    adminProductFilters.categoria = document.getElementById('product-category-filter')?.value.trim() || '';
                    loadProducts(1);
                });
            }

            function resetProductFilters() {
                adminProductFilters.nombre = '';
                adminProductFilters.categoria = '';

                const nameInput = document.getElementById('product-name-filter');
                const categorySelect = document.getElementById('product-category-filter');

                if (nameInput) nameInput.value = '';
                if (categorySelect) categorySelect.value = '';

                loadProducts(1);
            }
            
            function renderAdminProductsPagination(metadata) {
                if (!metadata || !metadata.hasNextPage) {
                    return '';
                }

                return `
                    <div class="pagination-container admin-pagination">
                        <button class="btn-hero" style="width: 100%; margin-top: 1rem;" onclick="loadProducts(${metadata.currentPage + 1})">
                            <i class="fa-solid fa-arrow-down"></i> Cargar más productos
                        </button>
                        <span class="pagination-info" style="text-align: center; display: block; margin-top: 0.5rem;">
                            Mostrando ${metadata.fromItem}-${metadata.toItem} de ${metadata.totalItems}
                        </span>
                    </div>
                `;
            }

            function renderAdminCustomersPagination(metadata) {
                if (!metadata || !metadata.hasNextPage) {
                    return '';
                }

                return `
                    <div class="pagination-container admin-pagination">
                        <button class="btn-hero" style="width: 100%; margin-top: 1rem;" onclick="loadCustomers(${metadata.currentPage + 1})">
                            <i class="fa-solid fa-arrow-down"></i> Cargar más clientes
                        </button>
                        <span class="pagination-info" style="text-align: center; display: block; margin-top: 0.5rem;">
                            Mostrando ${metadata.fromItem}-${metadata.toItem} de ${metadata.totalItems}
                        </span>
                    </div>
                `;
            }

            function renderAdminCouponsPagination(metadata) {
                if (!metadata || !metadata.hasNextPage) {
                    return '';
                }

                return `
                    <div class="pagination-container admin-pagination">
                        <button class="btn-hero" style="width: 100%; margin-top: 1rem;" onclick="loadCoupons(${metadata.currentPage + 1})">
                            <i class="fa-solid fa-arrow-down"></i> Cargar más descuentos
                        </button>
                        <span class="pagination-info" style="text-align: center; display: block; margin-top: 0.5rem;">
                            Mostrando ${metadata.fromItem}-${metadata.toItem} de ${metadata.totalItems}
                        </span>
                    </div>
                `;
            }

            function csvEscape(value) {
                const text = String(value ?? '');
                return `"${text.replace(/"/g, '""')}"`;
            }

            function downloadCsv(filename, headers, rows) {
                const separator = ';';
                const content = [
                    headers.map(csvEscape).join(separator),
                    ...rows.map((row) => row.map(csvEscape).join(separator)),
                ].join('\r\n');
                const blob = new Blob([`\ufeff${content}`], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');

                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                link.remove();
                URL.revokeObjectURL(url);
            }

            function getCouponId(coupon) {
                return coupon.id_cupon || coupon.id;
            }

            function getCouponStatus(coupon) {
                if (!coupon.activo) {
                    return { label: 'Inactivo', className: 'is-paused' };
                }

                return coupon.es_valido
                    ? { label: 'Válido', className: 'is-valid' }
                    : { label: 'No válido', className: 'is-invalid' };
            }

            async function getAllProductsForExport() {
                const totalItems = Number(lastProductsPagination?.totalItems) || lastAdminProducts.length;
                if (!totalItems || totalItems <= lastAdminProducts.length) {
                    return lastAdminProducts;
                }

                const response = await fetch(buildProductsUrl(1, totalItems));
                if (!response.ok) throw new Error('No se pudo exportar productos');
                const payload = await response.json();
                return getItemsFromResponse(payload);
            }

            async function getAllCustomersForExport() {
                const totalItems = Number(lastCustomersPagination?.totalItems) || lastAdminCustomers.length;
                if (!totalItems || totalItems <= lastAdminCustomers.length) {
                    return lastAdminCustomers;
                }

                const response = await fetch(buildCustomersUrl(1, totalItems), {
                    headers: getAuthHeaders(),
                });
                if (!response.ok) throw new Error('No se pudo exportar clientes');
                const payload = await response.json();
                return getItemsFromResponse(payload);
            }

            async function getAllCouponsForExport() {
                const totalItems = Number(lastCouponsPagination?.totalItems) || lastAdminCoupons.length;
                if (!totalItems || totalItems <= lastAdminCoupons.length) {
                    return lastAdminCoupons;
                }

                const response = await fetch(buildCouponsUrl(1, totalItems), {
                    headers: getAuthHeaders(),
                });
                if (!response.ok) throw new Error('No se pudo exportar cupones');
                const payload = await response.json();
                return getItemsFromResponse(payload);
            }

            async function exportProductsCsv() {
                try {
                    const products = await getAllProductsForExport();
                    if (!products.length) {
                        showNotification('No hay productos para exportar', 'error');
                        return;
                    }

                    const rows = products.map((product) => [
                        product.id,
                        product.name || product.nombre || '',
                        product.price ?? product.precio ?? '',
                        product.stock ?? '',
                        product.categoria || product.category || '',
                        product.image || product.imagen || '',
                    ]);

                    downloadCsv(
                        'productos-admin.csv',
                        ['ID', 'Nombre', 'Precio', 'Stock', 'Categoria', 'Imagen'],
                        rows
                    );
                    showNotification('CSV de productos generado');
                } catch (error) {
                    console.error('Error:', error);
                    showNotification(error.message, 'error');
                }
            }

            async function exportCustomersCsv() {
                try {
                    const customers = await getAllCustomersForExport();
                    if (!customers.length) {
                        showNotification('No hay clientes para exportar', 'error');
                        return;
                    }

                    const rows = customers.map((customer) => [
                        customer.id,
                        customer.name || customer.nombre || '',
                        customer.apellido || '',
                        customer.email || '',
                        customer.telefono || '',
                        customer.direccion || '',
                        customer.role || 'user',
                    ]);

                    downloadCsv(
                        'clientes-admin.csv',
                        ['ID', 'Nombre', 'Apellido', 'Email', 'Telefono', 'Direccion', 'Rol'],
                        rows
                    );
                    showNotification('CSV de clientes generado');
                } catch (error) {
                    console.error('Error:', error);
                    showNotification(error.message, 'error');
                }
            }

            async function exportCouponsCsv() {
                try {
                    const coupons = await getAllCouponsForExport();
                    if (!coupons.length) {
                        showNotification('No hay cupones para exportar', 'error');
                        return;
                    }

                    const rows = coupons.map((coupon) => [
                        getCouponId(coupon),
                        coupon.codigo || '',
                        coupon.descuento ?? '',
                        coupon.fecha_vencimiento || '',
                        coupon.limite_stock ?? '',
                        coupon.usos_actuales ?? '',
                        coupon.activo ? 'Activo' : 'Inactivo',
                        coupon.es_valido ? 'Valido' : 'No valido',
                    ]);

                    downloadCsv(
                        'cupones-admin.csv',
                        ['ID', 'Codigo', 'Descuento', 'Fecha vencimiento', 'Limite stock', 'Usos actuales', 'Activo', 'Validez'],
                        rows
                    );
                    showNotification('CSV de cupones generado');
                } catch (error) {
                    console.error('Error:', error);
                    showNotification(error.message, 'error');
                }
            }
            
            async function loadProducts(page = adminProductsPage) {
                const container = document.getElementById('products-container');
                
                // Prevenir cargas simultáneas
                if (isLoadingProducts) return;
                isLoadingProducts = true;
                
                adminProductsPage = Math.max(Number(page) || 1, 1);
                
                try {
                    // Si es la primera página, resetear datos acumulados
                    if (adminProductsPage === 1) {
                        allProductsData = [];
                    }
                    
                    const response = await fetch(buildProductsUrl(adminProductsPage));
                    if (!response.ok) throw new Error('Error al cargar productos');
                    
                    const payload = await response.json();
                    const products = getItemsFromResponse(payload);
                    const metadata = getPaginationFromResponse(payload, products.length);
                    lastAdminProducts = products;
                    lastProductsPagination = metadata;
                    
                    if ((!products || products.length === 0) && metadata?.totalItems > 0 && adminProductsPage > 1) {
                        await loadProducts(adminProductsPage - 1);
                        isLoadingProducts = false;
                        return;
                    }

                    if (!products || products.length === 0) {
                        if (adminProductsPage === 1) {
                            container.innerHTML = `
                                <div class="empty-state">
                                    <i class="fa-solid fa-box-open"></i>
                                    <p>${hasActiveProductFilters() ? 'No hay productos que coincidan con el filtro' : 'No hay productos registrados'}</p>
                                    ${hasActiveProductFilters() ? `
                                        <button class="btn-hero" onclick="resetProductFilters()">
                                            <i class="fa-solid fa-rotate-left"></i> Limpiar filtros
                                        </button>
                                    ` : `
                                        <button class="btn-hero" onclick="openProductModal()">
                                            <i class="fa-solid fa-plus"></i> Crear primer producto
                                        </button>
                                    `}
                                </div>
                            `;
                        }
                        isLoadingProducts = false;
                        return;
                    }
                    
                    // Acumular datos
                    allProductsData = allProductsData.concat(products);
                    
                    let html = `
                        <div class="admin-table-container">
                            <table class="admin-table product-admin-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Imagen</th>
                                        <th>Nombre</th>
                                        <th>Precio</th>
                                        <th>Stock</th>
                                        <th>Categoría</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;
                    
                    allProductsData.forEach(product => {
                        const nombre = product.name || product.nombre || 'Sin nombre';
                        const precio = Number(product.price ?? product.precio ?? 0).toLocaleString('es-AR');
                        const stock = Number(product.stock ?? 0);
                        const categoria = product.categoria || product.category || 'Sin categoría';
                        const imagen = product.image || product.imagen || '../img/placeholder.png';
                        
                        html += `
                            <tr>
                                <td>${escapeHtml(product.id)}</td>
                                <td><img src="${escapeHtml(imagen)}" alt="${escapeHtml(nombre)}" class="product-image-thumb" onerror="this.src='../img/placeholder.png'"></td>
                                <td class="product-name-cell"><strong>${escapeHtml(nombre)}</strong></td>
                                <td>$${precio}</td>
                                <td><span class="stock-pill ${stock <= 0 ? 'is-empty' : ''}">${stock}</span></td>
                                <td><span class="category-chip">${escapeHtml(categoria)}</span></td>
                                <td class="admin-actions">
                                    <button class="btn-edit" onclick="editProduct(${product.id})">
                                        <i class="fa-solid fa-pencil"></i> Editar
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                    
                    html += `
                                </tbody>
                            </table>
                        </div>
                        ${renderAdminProductsPagination(metadata)}
                    `;
                    
                    container.innerHTML = html;
                    
                } catch (error) {
                    console.error('Error:', error);
                    if (adminProductsPage === 1) {
                        container.innerHTML = `
                            <div class="empty-state">
                                <i class="fa-solid fa-circle-exclamation"></i>
                                <p>Error al cargar productos: ${error.message}</p>
                                <button class="btn-hero" onclick="loadProducts()">
                                    <i class="fa-solid fa-rotate-right"></i> Reintentar
                                </button>
                            </div>
                        `;
                    }
                } finally {
                    isLoadingProducts = false;
                }
            }
            
            // ========== FUNCIONES PARA CLIENTES ==========
            
            async function loadCustomers(page = adminCustomersPage) {
                const container = document.getElementById('customers-container');
                const token = localStorage.getItem('token');
                
                // Prevenir cargas simultáneas
                if (isLoadingCustomers) return;
                isLoadingCustomers = true;
                
                adminCustomersPage = Math.max(Number(page) || 1, 1);
                
                try {
                    // Si es la primera página, resetear datos acumulados
                    if (adminCustomersPage === 1) {
                        allCustomersData = [];
                    }
                    
                    const response = await fetch(buildCustomersUrl(adminCustomersPage), {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    
                    if (!response.ok) throw new Error('Error al cargar clientes');
                    
                    const payload = await response.json();
                    const customers = getItemsFromResponse(payload);
                    const metadata = getPaginationFromResponse(payload, customers.length);
                    lastAdminCustomers = customers;
                    lastCustomersPagination = metadata;

                    if ((!customers || customers.length === 0) && metadata?.totalItems > 0 && adminCustomersPage > 1) {
                        await loadCustomers(adminCustomersPage - 1);
                        isLoadingCustomers = false;
                        return;
                    }
                    
                    if (!customers || customers.length === 0) {
                        if (adminCustomersPage === 1) {
                            container.innerHTML = `
                                <div class="empty-state">
                                    <i class="fa-solid fa-users"></i>
                                    <p>No hay clientes registrados</p>
                                </div>
                            `;
                        }
                        isLoadingCustomers = false;
                        return;
                    }
                    
                    // Acumular datos
                    allCustomersData = allCustomersData.concat(customers);
                    
                    let html = `
                        <div class="admin-table-container">
                            <table class="admin-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Nombre</th>
                                        <th>Email</th>
                                        <th>Rol</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;
                    
                    allCustomersData.forEach(customer => {
                        const nombre = customer.name || customer.nombre || 'Sin nombre';
                        const rol = customer.role === 'admin' ? 'admin' : 'user';
                        
                        html += `
                            <tr>
                                <td>${escapeHtml(customer.id)}</td>
                                <td><strong>${escapeHtml(nombre)}</strong></td>
                                <td>${escapeHtml(customer.email || '')}</td>
                                <td><span class="role-badge role-${rol}">${rol === 'admin' ? 'Administrador' : 'Cliente'}</span></td>
                                <td class="admin-actions">
                                    <button class="btn-edit" onclick="editCustomer(${customer.id})">
                                        <i class="fa-solid fa-pencil"></i> Editar
                                    </button>
                                    <button class="btn-delete" onclick="deleteCustomer(${customer.id})">
                                        <i class="fa-solid fa-trash"></i> Eliminar
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                    
                    html += `
                                </tbody>
                            </table>
                        </div>
                        ${renderAdminCustomersPagination(metadata)}
                    `;
                    
                    container.innerHTML = html;
                    
                } catch (error) {
                    console.error('Error:', error);
                    if (adminCustomersPage === 1) {
                        container.innerHTML = `
                            <div class="empty-state">
                                <i class="fa-solid fa-circle-exclamation"></i>
                                <p>Error al cargar clientes: ${error.message}</p>
                            </div>
                        `;
                    }
                } finally {
                    isLoadingCustomers = false;
                }
            }

            // ========== FUNCIONES PARA CUPONES ==========

            async function loadCoupons(page = adminCouponsPage) {
                const container = document.getElementById('coupons-container');
                
                // Prevenir cargas simultáneas
                if (isLoadingCoupons) return;
                isLoadingCoupons = true;
                
                adminCouponsPage = Math.max(Number(page) || 1, 1);

                try {
                    // Si es la primera página, resetear datos acumulados
                    if (adminCouponsPage === 1) {
                        allCouponsData = [];
                    }
                    const response = await fetch(buildCouponsUrl(adminCouponsPage), {
                        headers: getAuthHeaders()
                    });

                    if (!response.ok) throw new Error(await getErrorMessage(response, 'Error al cargar cupones'));

                    const payload = await response.json();
                    const coupons = getItemsFromResponse(payload);
                    const metadata = getPaginationFromResponse(payload, coupons.length);
                    lastAdminCoupons = coupons;
                    lastCouponsPagination = metadata;

                    if ((!coupons || coupons.length === 0) && metadata?.totalItems > 0 && adminCouponsPage > 1) {
                        await loadCoupons(adminCouponsPage - 1);
                        isLoadingCoupons = false;
                        return;
                    }

                    if (!coupons || coupons.length === 0) {
                        if (adminCouponsPage === 1) {
                            container.innerHTML = `
                                <div class="empty-state">
                                    <i class="fa-solid fa-ticket"></i>
                                    <p>No hay cupones registrados</p>
                                    <button class="btn-hero" onclick="openCouponModal()">
                                        <i class="fa-solid fa-plus"></i> Crear primer cupón
                                    </button>
                                </div>
                            `;
                        }
                        isLoadingCoupons = false;
                        return;
                    }

                    // Acumular datos
                    allCouponsData = allCouponsData.concat(coupons);

                    let html = `
                        <div class="admin-table-container">
                            <table class="admin-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Código</th>
                                        <th>Descuento</th>
                                        <th>Vence</th>
                                        <th>Uso</th>
                                        <th>Estado</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;

                    allCouponsData.forEach((coupon) => {
                        const couponId = getCouponId(coupon);
                        const status = getCouponStatus(coupon);
                        const usosActuales = Number(coupon.usos_actuales || 0);
                        const limiteStock = Number(coupon.limite_stock || 0);

                        html += `
                            <tr>
                                <td>${escapeHtml(couponId)}</td>
                                <td><strong>${escapeHtml(coupon.codigo || 'Sin código')}</strong></td>
                                <td>${escapeHtml(coupon.descuento)}%</td>
                                <td>${escapeHtml(coupon.fecha_vencimiento || '')}</td>
                                <td>${usosActuales}/${limiteStock}</td>
                                <td><span class="status-chip ${status.className}">${status.label}</span></td>
                                <td class="admin-actions">
                                    <button class="btn-edit" onclick="editCoupon(${couponId})">
                                        <i class="fa-solid fa-pencil"></i> Editar
                                    </button>
                                    <button class="btn-delete" onclick="deleteCoupon(${couponId})">
                                        <i class="fa-solid fa-trash"></i> Eliminar
                                    </button>
                                </td>
                            </tr>
                        `;
                    });

                    html += `
                                </tbody>
                            </table>
                        </div>
                        ${renderAdminCouponsPagination(metadata)}
                    `;

                    container.innerHTML = html;
                } catch (error) {
                    console.error('Error:', error);
                    if (adminCouponsPage === 1) {
                        container.innerHTML = `
                            <div class="empty-state">
                                <i class="fa-solid fa-circle-exclamation"></i>
                                <p>Error al cargar cupones: ${error.message}</p>
                                <button class="btn-hero" onclick="loadCoupons()">
                                    <i class="fa-solid fa-rotate-right"></i> Reintentar
                            </button>
                        </div>
                    `;
                    }
                } finally {
                    isLoadingCoupons = false;
                }
            }
            
            // ========== CRUD DE PRODUCTOS ==========
            
            function openProductModal(product = null) {
                const modal = document.getElementById('admin-modal');
                const modalContent = modal.querySelector('.modal-content');
                const modalTitle = document.getElementById('modal-title');
                const modalBody = document.getElementById('modal-body');
                
                const isEdit = product !== null;
                modalTitle.textContent = isEdit ? 'Editar Producto' : 'Nuevo Producto';
                
                modalBody.innerHTML = `
                    <form id="product-form">
                        <div class="form-group">
                            <label>Nombre del Producto *</label>
                            <input type="text" id="prod-name" value="${isEdit ? (product.name || product.nombre || '') : ''}" required placeholder="Ej. Auriculares Bluetooth">
                        </div>
                        <div class="form-group">
                            <label>Precio *</label>
                            <input type="number" id="prod-price" value="${isEdit ? (product.price || product.precio || 0) : ''}" required step="0.01" placeholder="Ej. 15000">
                        </div>
                        <div class="form-group">
                            <label>Stock *</label>
                            <input type="number" id="prod-stock" value="${isEdit ? (product.stock || 0) : ''}" required placeholder="Ej. 10">
                        </div>
                        <div class="form-group">
                            <label>Categoría *</label>
                            <input type="text" id="prod-category" value="${isEdit ? (product.categoria || product.category || '') : ''}" required placeholder="Ej. Electrónica">
                        </div>
                        <div class="form-group">
                            <label>Descripción</label>
                            <textarea id="prod-description" rows="3" placeholder="Descripción del producto">${isEdit ? escapeHtml(product.descripcion || '') : ''}</textarea>
                        </div>
                        <div class="form-group">
                            <label>URL de la Imagen</label>
                            <input type="text" id="prod-image" value="${isEdit ? (product.image || product.imagen || '') : ''}" placeholder="../img/producto.png">
                            <small>Dejar vacío para usar imagen por defecto</small>
                        </div>
                    </form>
                `;
                
                const footer = document.createElement('div');
                footer.className = 'modal-footer';
                footer.innerHTML = `
                    <button type="button" class="btn-modal-cancel" onclick="closeAdminModal()">Cancelar</button>
                    <button type="button" class="btn-modal-save" onclick="saveProduct(${isEdit ? product.id : 'null'})">Guardar</button>
                `;
                
                // Limpiar footer anterior si existe
                const oldFooter = modal.querySelector('.modal-footer');
                if (oldFooter) oldFooter.remove();
                modalContent.appendChild(footer);
                modalBody.scrollTop = 0;
                
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
            
            async function saveProduct(productId = null) {
                const name = document.getElementById('prod-name')?.value;
                const price = parseFloat(document.getElementById('prod-price')?.value);
                const stock = parseInt(document.getElementById('prod-stock')?.value);
                const category = document.getElementById('prod-category')?.value;
                const image = document.getElementById('prod-image')?.value || '../img/placeholder.png';
                const descripcion = document.getElementById('prod-description')?.value.trim() || '';
                
                if (!name || isNaN(price) || isNaN(stock) || !category) {
                    showNotification('Por favor, completá todos los campos obligatorios', 'error');
                    return;
                }
                
                const productData = {
                    nombre: name,
                    precio: price,
                    stock: stock,
                    categoria: category,
                    descripcion,
                    image: image,
                    validFrom: new Date().toISOString(),
                    validTo: '2030-12-31T23:59:59.999Z'
                };
                
                try {
                    let url = '/api/productos';
                    let method = 'POST';
                    
                    if (productId) {
                        url = `/api/productos/${productId}`;
                        method = 'PUT';
                    }
                    
                    const response = await fetch(url, {
                        method: method,
                        headers: {
                            'Content-Type': 'application/json',
                            ...getAuthHeaders()
                        },
                        body: JSON.stringify(productData)
                    });
                    
                    if (!response.ok) {
                        throw new Error(await getErrorMessage(response, 'Error al guardar producto'));
                    }
                    
                    showNotification(productId ? '✓ Producto actualizado' : '✓ Producto creado');
                    closeAdminModal();
                    await loadProductCategories();
                    await loadProducts(productId ? adminProductsPage : 1);
                    
                } catch (error) {
                    console.error('Error:', error);
                    showNotification(`Error: ${error.message}`, 'error');
                }
            }
            
            async function editProduct(id) {
                try {
                    const response = await fetch(`/api/productos/${id}`);
                    if (!response.ok) throw new Error('Error al cargar producto');
                    
                    const product = await response.json();
                    openProductModal(product);
                    
                } catch (error) {
                    console.error('Error:', error);
                    showNotification('Error al cargar el producto', 'error');
                }
            }
            
            async function deleteProduct(id) {
                if (!confirm('¿Estás seguro de que querés eliminar este producto? Esta acción no se puede deshacer.')) {
                    return;
                }
                
                try {
                    const response = await fetch(`/api/productos/${id}`, {
                        method: 'DELETE',
                        headers: getAuthHeaders()
                    });
                    
                    if (!response.ok) {
                        throw new Error(await getErrorMessage(response, 'Error al eliminar producto'));
                    }
                    
                    showNotification('✓ Producto eliminado');
                    await loadProductCategories();
                    await loadProducts(adminProductsPage);
                    
                } catch (error) {
                    console.error('Error:', error);
                    showNotification(`Error: ${error.message}`, 'error');
                }
            }
            
            // ========== CRUD DE CLIENTES ==========
            
            function openCustomerModal(customer = null) {
                const modal = document.getElementById('admin-modal');
                const modalContent = modal.querySelector('.modal-content');
                const modalTitle = document.getElementById('modal-title');
                const modalBody = document.getElementById('modal-body');
                
                const isEdit = customer !== null;
                modalTitle.textContent = isEdit ? 'Editar Cliente' : 'Nuevo Cliente';
                
                modalBody.innerHTML = `
                    <form id="customer-form">
                        <div class="form-group">
                            <label>Nombre Completo *</label>
                            <input type="text" id="cust-name" value="${isEdit ? (customer.name || customer.nombre || '') : ''}" required placeholder="Ej. Juan Pérez">
                        </div>
                        <div class="form-group">
                            <label>Correo Electrónico *</label>
                            <input type="email" id="cust-email" value="${isEdit ? (customer.email || '') : ''}" required placeholder="cliente@ejemplo.com">
                        </div>
                        ${!isEdit ? `
                        <div class="form-group">
                            <label>Contraseña *</label>
                            <input type="password" id="cust-password" required placeholder="Mínimo 6 caracteres">
                        </div>
                        ` : ''}
                        <div class="form-group">
                            <label>Rol</label>
                            <select id="cust-role">
                                <option value="client" ${isEdit && customer.role === 'client' ? 'selected' : ''}>Cliente</option>
                                <option value="admin" ${isEdit && customer.role === 'admin' ? 'selected' : ''}>Administrador</option>
                            </select>
                        </div>
                    </form>
                `;
                
                const footer = document.createElement('div');
                footer.className = 'modal-footer';
                footer.innerHTML = `
                    <button type="button" class="btn-modal-cancel" onclick="closeAdminModal()">Cancelar</button>
                    <button type="button" class="btn-modal-save" onclick="saveCustomer(${isEdit ? customer.id : 'null'})">Guardar</button>
                `;
                
                const oldFooter = modal.querySelector('.modal-footer');
                if (oldFooter) oldFooter.remove();
                modalContent.appendChild(footer);
                modalBody.scrollTop = 0;
                
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
            
            async function saveCustomer(customerId = null) {
                const name = document.getElementById('cust-name')?.value;
                const email = document.getElementById('cust-email')?.value;
                const role = document.getElementById('cust-role')?.value;
                const token = localStorage.getItem('token');
                
                if (!name || !email) {
                    showNotification('Por favor, completá todos los campos obligatorios', 'error');
                    return;
                }
                
                const customerData = {
                    name: name,
                    email: email,
                    role: role || 'client'
                };
                
                if (!customerId) {
                    const password = document.getElementById('cust-password')?.value;
                    if (!password || password.length < 6) {
                        showNotification('La contraseña debe tener al menos 6 caracteres', 'error');
                        return;
                    }
                    customerData.password = password;
                }
                
                try {
                    let url = '/api/usuarios';
                    let method = 'POST';
                    
                    if (customerId) {
                        url = `/api/usuarios/${customerId}`;
                        method = 'PUT';
                    }
                    
                    const response = await fetch(url, {
                        method: method,
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(customerData)
                    });
                    
                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.mensaje || 'Error al guardar cliente');
                    }
                    
                    showNotification(customerId ? '✓ Cliente actualizado' : '✓ Cliente registrado');
                    closeAdminModal();
                    await loadCustomers();
                    
                } catch (error) {
                    console.error('Error:', error);
                    showNotification(`Error: ${error.message}`, 'error');
                }
            }
            
            async function editCustomer(id) {
                const token = localStorage.getItem('token');
                
                try {
                    const response = await fetch(`/api/usuarios/${id}`, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    if (!response.ok) throw new Error('Error al cargar cliente');
                    
                    const customer = await response.json();
                    openCustomerModal(customer);
                    
                } catch (error) {
                    console.error('Error:', error);
                    showNotification('Error al cargar el cliente', 'error');
                }
            }
            
            async function deleteCustomer(id) {
                if (!confirm('¿Estás seguro de que querés eliminar este usuario?')) {
                    return;
                }
                
                const token = localStorage.getItem('token');
                
                try {
                    const response = await fetch(`/api/usuarios/${id}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    
                    if (!response.ok) throw new Error('Error al eliminar usuario');
                    
                    showNotification('✓ Usuario eliminado');
                    await loadCustomers();
                    
                } catch (error) {
                    console.error('Error:', error);
                    showNotification('Error al eliminar usuario', 'error');
                }
            }

            // ========== CRUD DE CUPONES ==========

            function openCouponModal(coupon = null) {
                const modal = document.getElementById('admin-modal');
                const modalContent = modal.querySelector('.modal-content');
                const modalTitle = document.getElementById('modal-title');
                const modalBody = document.getElementById('modal-body');

                const isEdit = coupon !== null;
                const couponId = isEdit ? getCouponId(coupon) : null;
                modalTitle.textContent = isEdit ? 'Editar Cupón' : 'Nuevo Cupón';

                modalBody.innerHTML = `
                    <form id="coupon-form">
                        <div class="form-group">
                            <label>Código *</label>
                            <input type="text" id="coupon-code" value="${isEdit ? escapeHtml(coupon.codigo || '') : ''}" required placeholder="Ej. BIENVENIDA10">
                        </div>
                        <div class="form-group">
                            <label>Descuento (%) *</label>
                            <input type="number" id="coupon-discount" value="${isEdit ? Number(coupon.descuento || 0) : ''}" required min="1" max="100" placeholder="Ej. 15">
                        </div>
                        <div class="form-group">
                            <label>Fecha de vencimiento *</label>
                            <input type="date" id="coupon-expiration" value="${isEdit ? escapeHtml(coupon.fecha_vencimiento || '') : ''}" required>
                        </div>
                        <div class="form-group">
                            <label>Límite de usos *</label>
                            <input type="number" id="coupon-stock" value="${isEdit ? Number(coupon.limite_stock || 1) : ''}" required min="1" placeholder="Ej. 50">
                        </div>
                        ${isEdit ? `
                        <div class="form-group">
                            <label>Usos actuales</label>
                            <input type="number" id="coupon-used" value="${Number(coupon.usos_actuales || 0)}" min="0">
                        </div>
                        ` : ''}
                        <div class="form-group">
                            <label>Estado</label>
                            <select id="coupon-active">
                                <option value="true" ${!isEdit || coupon.activo ? 'selected' : ''}>Activo</option>
                                <option value="false" ${isEdit && !coupon.activo ? 'selected' : ''}>Inactivo</option>
                            </select>
                        </div>
                    </form>
                `;

                const footer = document.createElement('div');
                footer.className = 'modal-footer';
                footer.innerHTML = `
                    <button type="button" class="btn-modal-cancel" onclick="closeAdminModal()">Cancelar</button>
                    <button type="button" class="btn-modal-save" onclick="saveCoupon(${couponId || 'null'})">Guardar</button>
                `;

                const oldFooter = modal.querySelector('.modal-footer');
                if (oldFooter) oldFooter.remove();
                modalContent.appendChild(footer);
                modalBody.scrollTop = 0;

                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            async function saveCoupon(couponId = null) {
                const codigo = document.getElementById('coupon-code')?.value.trim().toUpperCase();
                const descuento = parseInt(document.getElementById('coupon-discount')?.value, 10);
                const fechaVencimiento = document.getElementById('coupon-expiration')?.value;
                const limiteStock = parseInt(document.getElementById('coupon-stock')?.value, 10);
                const usosActualesInput = document.getElementById('coupon-used');
                const activo = document.getElementById('coupon-active')?.value === 'true';

                if (!codigo || !fechaVencimiento || isNaN(descuento) || isNaN(limiteStock)) {
                    showNotification('Por favor, completá todos los campos obligatorios', 'error');
                    return;
                }

                if (descuento < 1 || descuento > 100) {
                    showNotification('El descuento debe estar entre 1 y 100', 'error');
                    return;
                }

                if (limiteStock < 1) {
                    showNotification('El límite de usos debe ser mayor a 0', 'error');
                    return;
                }

                const couponData = {
                    codigo,
                    descuento,
                    fecha_vencimiento: fechaVencimiento,
                    limite_stock: limiteStock,
                    activo
                };

                if (couponId && usosActualesInput) {
                    const usosActuales = parseInt(usosActualesInput.value, 10) || 0;
                    if (usosActuales < 0) {
                        showNotification('Los usos actuales no pueden ser negativos', 'error');
                        return;
                    }
                    couponData.usos_actuales = usosActuales;
                }

                try {
                    const url = couponId ? `/api/cupones/${couponId}` : '/api/cupones';
                    const method = couponId ? 'PUT' : 'POST';
                    const response = await fetch(url, {
                        method,
                        headers: {
                            'Content-Type': 'application/json',
                            ...getAuthHeaders()
                        },
                        body: JSON.stringify(couponData)
                    });

                    if (!response.ok) {
                        throw new Error(await getErrorMessage(response, 'Error al guardar cupón'));
                    }

                    showNotification(couponId ? '✓ Cupón actualizado' : '✓ Cupón creado');
                    closeAdminModal();
                    await loadCoupons(couponId ? adminCouponsPage : 1);
                } catch (error) {
                    console.error('Error:', error);
                    showNotification(`Error: ${error.message}`, 'error');
                }
            }

            async function editCoupon(id) {
                try {
                    const response = await fetch(`/api/cupones/${id}`, {
                        headers: getAuthHeaders()
                    });

                    if (!response.ok) {
                        throw new Error(await getErrorMessage(response, 'Error al cargar cupón'));
                    }

                    const coupon = await response.json();
                    openCouponModal(coupon);
                } catch (error) {
                    console.error('Error:', error);
                    showNotification(`Error: ${error.message}`, 'error');
                }
            }

            async function deleteCoupon(id) {
                if (!confirm('¿Estás seguro de que querés eliminar este cupón?')) {
                    return;
                }

                try {
                    const response = await fetch(`/api/cupones/${id}`, {
                        method: 'DELETE',
                        headers: getAuthHeaders()
                    });

                    if (!response.ok) {
                        throw new Error(await getErrorMessage(response, 'Error al eliminar cupón'));
                    }

                    showNotification('✓ Cupón eliminado');
                    await loadCoupons(adminCouponsPage);
                } catch (error) {
                    console.error('Error:', error);
                    showNotification(`Error: ${error.message}`, 'error');
                }
            }
            
            // ========== FUNCIONES GENERALES ==========
            
            function switchAdminView(view) {
                const productsSec = document.getElementById('admin-products');
                const customersSec = document.getElementById('admin-customers');
                const couponsSec = document.getElementById('admin-coupons');
                const prodBtn = document.getElementById('nav-prod');
                const custBtn = document.getElementById('nav-cust');
                const coupBtn = document.getElementById('nav-coup');

                productsSec.classList.toggle('active', view === 'products');
                customersSec.classList.toggle('active', view === 'customers');
                couponsSec.classList.toggle('active', view === 'coupons');

                prodBtn.classList.toggle('active', view === 'products');
                custBtn.classList.toggle('active', view === 'customers');
                coupBtn.classList.toggle('active', view === 'coupons');

                if (view === 'products') {
                    loadProducts();
                } else if (view === 'customers') {
                    loadCustomers();
                } else if (view === 'coupons') {
                    loadCoupons();
                }
            }
            
            function closeAdminModal() {
                const modal = document.getElementById('admin-modal');
                modal.classList.remove('active');
                document.body.style.overflow = '';
            }
            
            function showNotification(message, type = 'success') {
                let notification = document.getElementById('notification');
                if (!notification) {
                    notification = document.createElement('div');
                    notification.id = 'notification';
                    notification.className = 'notification';
                    document.body.appendChild(notification);
                }
                
                notification.className = `notification ${type === 'error' ? 'notif-error' : 'notif-success'}`;
                notification.textContent = message;
                notification.classList.add('show');
                
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }
            
            // ========== LOGOUT ==========
            async function logoutUsuario() {
                const token = localStorage.getItem('token');
                const cart = JSON.parse(localStorage.getItem('cart')) || [];
                
                if (token && cart.length > 0) {
                    try {
                        await fetch('/api/clientes/carrito', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            },
                            body: JSON.stringify({ carrito: cart })
                        });
                    } catch (error) {
                        console.error('Error guardando carrito:', error);
                    }
                }
                
                localStorage.clear();
                showNotification('Sesión cerrada correctamente');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1000);
            }
            
            // ========== INICIALIZACIÓN ==========
            document.addEventListener('DOMContentLoaded', () => {
                setupProductFilters();
                loadProductCategories();
                loadProducts();
            });
            
            // Exponer funciones globalmente
            window.switchAdminView = switchAdminView;
            window.openProductModal = openProductModal;
            window.openCustomerModal = openCustomerModal;
            window.openCouponModal = openCouponModal;
            window.editProduct = editProduct;
            window.deleteProduct = deleteProduct;
            window.editCustomer = editCustomer;
            window.deleteCustomer = deleteCustomer;
            window.editCoupon = editCoupon;
            window.deleteCoupon = deleteCoupon;
            window.closeAdminModal = closeAdminModal;
            window.saveProduct = saveProduct;
            window.saveCustomer = saveCustomer;
            window.saveCoupon = saveCoupon;
            window.logoutUsuario = logoutUsuario;
            window.loadProducts = loadProducts;
            window.loadCustomers = loadCustomers;
            window.loadCoupons = loadCoupons;
            window.resetProductFilters = resetProductFilters;
            window.exportProductsCsv = exportProductsCsv;
            window.exportCustomersCsv = exportCustomersCsv;
            window.exportCouponsCsv = exportCouponsCsv;
            window.exportProductsCsv = exportProductsCsv;
            window.exportCustomersCsv = exportCustomersCsv;
            window.exportCouponsCsv = exportCouponsCsv;
     })();
    </script>
</body>
