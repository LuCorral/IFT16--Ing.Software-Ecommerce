<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>Ecommerce | Carrito</title>
</head>

<body>
    <header>
        <div class="logo-container">
            <a class="logo" href="../index.html">Ecommerce</a>
        </div>
        <div class="hamburger-menu" id="hamburger-menu">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <nav class="nav-menu" id="nav-menu">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="./productos.html">Productos</a></li>
                <li><a href="./cart.html"><i class="fa-solid fa-cart-shopping"></i><span class="nav-cart-label">Carrito</span><span id="cart-count">0</span></a></li>
                <li id="auth-admin-item" hidden><a class="nav-login" href="/admin.html">Dashboard Admin</a></li>
                <li id="auth-login-item"><a id="btn-nav-login" class="nav-login" href="/login.html">Iniciar sesión</a></li>
                <li id="auth-profile-item" hidden><a class="nav-login" href="/profile.html">Mi perfil</a></li>
                <li id="auth-session-item" hidden>
                    <span id="nav-user-greeting" class="nav-user-greeting"></span>
                    <button type="button" id="btn-nav-logout" class="nav-logout">Cerrar sesión</button>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="cart-container">
            <h1>Tu Carrito</h1>
            <div id="cart-items">
            </div>
            <div class="cart-summary">
                <div class="coupon-section">
                    <label for="coupon-code">Código de cupón</label>
                    <input type="text" id="coupon-code" autocomplete="off" placeholder="Ingresá tu código">
                    <button type="button" class="btn-secondary" id="btn-apply-coupon">Aplicar</button>
                    <p id="coupon-message" class="coupon-message" role="status" aria-live="polite"></p>
                </div>
                <div class="cart-totals" aria-live="polite">
                    <p>Subtotal: <span id="cart-subtotal">$0</span></p>
                    <p>Descuento: <span id="cart-discount">-$0</span></p>
                    <p class="cart-final-total">Total final: <span id="cart-total">$0</span></p>
                </div>
                <button id="btn-checkout" class="btn-buy">Crear pedido</button>
                <button id="btn-empty" class="btn-empty">Vaciar Carrito</button>
            </div>
        </section>
        <section class="orders-section" id="orders-section" aria-labelledby="orders-title">
            <h2 id="orders-title">Mis pedidos</h2>
            <div id="orders-container" aria-live="polite">
                <p>Cargando pedidos...</p>
            </div>
        </section>
    </main>
    <footer>
        <div>
            <p><span>Ecommerce</span></p>
        </div>
    </footer>
    <script src="../js/main.js?v=simulated-payments-receipts"></script>
</body>

</html>
