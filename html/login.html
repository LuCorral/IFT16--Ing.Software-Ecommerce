<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>Ecommerce | Iniciar sesión</title>
</head>

<body>
    <script>window.location.replace('/');</script>
    <header>
        <div class="logo-container">
            <a class="logo" href="../index.html">Ecommerce</a>
        </div>
        <div class="hamburger-menu" id="hamburger-menu">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <nav class="nav-menu" id="nav-menu">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="./productos.html">Productos</a></li>
                <li><a href="./cart.html"><i class="fa-solid fa-cart-shopping"></i><span class="nav-cart-label">Carrito</span><span id="cart-count">0</span></a></li>
            </ul>
        </nav>
    </header>
    <main>
    <div class="auth-container">
        <div class="auth-tabs">
            <button class="tab-btn active" id="tab-login" onclick="switchAuth('login')">Iniciar Sesión</button>
            <button class="tab-btn" id="tab-register" hidden onclick="switchAuth('register')">Crear Cuenta</button>
        </div>

        <form id="form-login" class="auth-form active">
            <h2>¡Hola de nuevo!</h2>
            <p class="auth-subtitle">Ingresá tus datos para acceder a tu cuenta.</p>
            
            <div class="input-group">
                <label for="login-email">Correo Electrónico</label>
                <input type="email" id="login-email" placeholder="ejemplo@correo.com" required>
            </div>
            
            <div class="input-group">
                <label for="login-password">Contraseña</label>
                <input type="password" id="login-password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-auth">Ingresar</button>
            <a href="#" class="auth-link" hidden>¿Olvidaste tu contraseña?</a>
        </form>

        <form id="form-register" class="auth-form" hidden>
            <h2>Crear una cuenta</h2>
            <p class="auth-subtitle">Registrate para realizar tus compras más rápido.</p>
            
            <div class="input-group">
                <label for="reg-name">Nombre Completo</label>
                <input type="text" id="reg-name" placeholder="Juan Pérez" required>
            </div>

            <div class="input-group">
                <label for="reg-email">Correo Electrónico</label>
                <input type="email" id="reg-email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="input-group">
                <label for="reg-telefono">Teléfono</label>
                <input type="tel" id="reg-telefono" placeholder="1122334455" inputmode="numeric" pattern="[0-9]+" required>
            </div>
            
            <div class="input-group">
                <label for="reg-password">Contraseña</label>
                <input type="password" id="reg-password" placeholder="Mínimo 8 caracteres" required>
            </div>

            <div class="input-group-checkbox">
                <input type="checkbox" id="reg-terms" required>
                <label for="reg-terms">Acepto los términos y condiciones</label>
            </div>
            
            <button type="submit" class="btn-auth">Registrarme</button>
        </form>
    </div>
    </main>
    <footer>
        <div>
            <p><span>Ecommerce</span></p>
        </div>
    </footer>
    <script src="../js/main.js"></script>
</body>

</html>
