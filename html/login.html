<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>Ecommerce | Iniciar sesión</title>
</head>

<body>
    <header>
        <div class="logo-container">
            <a class="logo" href="../index.html">Ecommerce</a>
        </div>
        <div class="hamburger-menu" id="hamburger-menu">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <nav class="nav-menu" id="nav-menu">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="./productos.html">Productos</a></li>
                <li><a href="./cart.html"><i class="fa-solid fa-cart-shopping"></i><span class="nav-cart-label">Carrito</span><span id="cart-count">0</span></a></li>
                <li id="auth-admin-item" hidden><a class="nav-login" href="/admin.html">Dashboard Admin</a></li>
                <li id="auth-login-item"><a id="btn-nav-login" class="nav-login" href="/login.html">Iniciar sesión</a></li>
                <li id="auth-profile-item" hidden><a class="nav-login" href="/profile.html">Mi perfil</a></li>
                <li id="auth-session-item" hidden>
                    <span id="nav-user-greeting" class="nav-user-greeting"></span>
                    <button type="button" id="btn-nav-logout" class="nav-logout">Cerrar sesión</button>
                </li>
            </ul>
        </nav>
    </header>
    <main>
    <div class="auth-container">
        <div class="auth-tabs">
            <button class="tab-btn active" id="tab-login" onclick="switchAuth('login')">Iniciar Sesión</button>
            <button class="tab-btn" id="tab-register" onclick="switchAuth('register')">Crear Cuenta</button>
        </div>

        <form id="form-login" class="auth-form active">
            <h2>¡Hola de nuevo!</h2>
            <p class="auth-subtitle">Ingresá tus datos para acceder a tu cuenta.</p>
            
            <div class="input-group">
                <label for="login-email">Correo Electrónico</label>
                <input type="email" id="login-email" placeholder="ejemplo@correo.com" required>
            </div>
            
            <div class="input-group">
                <label for="login-password">Contraseña</label>
                <input type="password" id="login-password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-auth">Ingresar</button>
            <a href="#" class="auth-link" hidden>¿Olvidaste tu contraseña?</a>
        </form>

        <form id="form-register" class="auth-form" hidden>
            <h2>Crear una cuenta</h2>
            <p class="auth-subtitle">Registrate para realizar tus compras más rápido.</p>
            
            <div class="input-group">
                <label for="reg-name">Nombre</label>
                <input type="text" id="reg-name" autocomplete="given-name" required>
            </div>

            <div class="input-group">
                <label for="reg-apellido">Apellido</label>
                <input type="text" id="reg-apellido" autocomplete="family-name" required>
            </div>

            <div class="input-group">
                <label for="reg-email">Correo Electrónico</label>
                <input type="email" id="reg-email" placeholder="ejemplo@correo.com" autocomplete="email" required>
            </div>
            
            <div class="input-group">
                <label for="reg-password">Contraseña</label>
                <input type="password" id="reg-password" placeholder="Mínimo 8 caracteres" minlength="8" autocomplete="new-password" required>
            </div>
            
            <button type="submit" class="btn-auth">Registrarme</button>
        </form>
    </div>
    </main>
    <footer>
        <div>
            <p><span>Ecommerce</span></p>
        </div>
    </footer>
    <script src="../js/main.js"></script>
</body>

</html>
