<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Tienda Online - Productos</title>
</head>

<body>
    <header>
        <div class="logo-container">
            <p class="logo">Tienda<span>Online</span></p>
        </div>
        <div class="hamburger-menu" id="hamburger-menu">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <nav class="nav-menu" id="nav-menu">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="./productos.html">Productos</a></li>
                <li><a href="./cart.html"><i class="fa-solid fa-cart-shopping"></i><span id="cart-count">0</span></a></li>
                <li><a href="./login.html" id="btn-nav-login" class="nav-login">Login</a></li>
                <li><a href="#" id="btn-nav-logout" class="nav-login" onclick="logoutUsuario(); return false;" style="display:none;">Salir</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="product-title">
            <h1>Nuestros productos</h1>
        </section>
        <section class="catalog-controls">
            <form id="product-controls">
                <label for="product-search">Buscar por nombre</label>
                <input type="search" id="product-search" placeholder="Ej. Cafetera" autocomplete="off">
                <label for="product-sort">Ordenar</label>
                <select id="product-sort">
                    <option value="id-asc">Orden predeterminado</option>
                    <option value="precio-asc">Precio: menor a mayor</option>
                    <option value="precio-desc">Precio: mayor a menor</option>
                    <option value="nombre-asc">Nombre: A-Z</option>
                    <option value="nombre-desc">Nombre: Z-A</option>
                </select>
                <button type="submit" class="btn-buy">Buscar</button>
            </form>
            <div class="filters-container">
                <h3>Filtrar por categoría</h3>
                <div class="filters-buttons" id="category-filters">
                    <button class="filter-btn active" data-category="all">Todos</button>
                </div>
            </div>
        </section>

        <section class="product-list" id="products-list">
            <!-- Los productos se cargarán dinámicamente con JavaScript -->
        </section>
    </main>
    <footer>
        <div>
            <p><span>Trabajo Práctico PP2 - Equipo 1 - IFTS-16</span> - &copy; 2026 Tienda Online. Todos los derechos reservados.</p>
        </div>
    </footer>
    <script src="../js/main.js?v=dynamic-categories"></script>
</body>

</html>
