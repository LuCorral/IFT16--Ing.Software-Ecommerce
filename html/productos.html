<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Ecommerce | Productos</title>
</head>

<body>
    <header>
        <div class="logo-container">
            <a class="logo" href="../index.html">Ecommerce</a>
        </div>
        <div class="hamburger-menu" id="hamburger-menu">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <nav class="nav-menu" id="nav-menu">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="./productos.html">Productos</a></li>
                <li><a href="./cart.html"><i class="fa-solid fa-cart-shopping"></i><span class="nav-cart-label">Carrito</span><span id="cart-count">0</span></a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="product-title">
            <h1>Nuestros productos</h1>
        </section>
        <section class="catalog-controls">
            <form id="product-controls">
                <label for="product-search">Buscar por nombre</label>
                <input type="search" id="product-search" placeholder="Ej. Cafetera" autocomplete="off">
                <button type="submit" class="btn-buy">Buscar</button>
            </form>
            <div class="filters-container">
                <h3>Filtrar por categoría</h3>
                <div class="filters-buttons" id="category-filters">
                    <button class="filter-btn active" data-category="all">Todos</button>
                </div>
            </div>
        </section>

        <section class="product-list" id="products-list">
            <!-- Los productos se cargarán dinámicamente con JavaScript -->
        </section>
    </main>
    <footer>
        <div>
            <p><span>Ecommerce</span></p>
        </div>
    </footer>
    <script src="../js/main.js?v=ecommerce-mvp-1"></script>
</body>

</html>
